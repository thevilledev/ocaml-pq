name: CI

on:
  # Branches are tested through their pull requests; also running on every
  # branch push would run each job twice.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ocaml:
    name: OCaml ${{ matrix.ocaml-compiler }}
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.13", "4.14", "5.1", "5.4"]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-doc
      - name: Build, test, and build documentation
        run: opam exec -- dune build @install @runtest @doc

  lower-bounds:
    name: Lower dependency bounds (non-blocking)
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the minimum supported OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "4.13"
      - name: Install current dependencies
        run: opam install . --deps-only --with-test --with-doc
      - name: Select the oldest allowed dependencies
        run: >-
          opam install --solver=builtin-0install
          --criteria="+removed,+count[version-lag,solution]"
          . --deps-only --with-test --with-doc
      - name: Build and test with lower bounds
        run: opam exec -- dune build @install @runtest @doc

  opam:
    name: opam release metadata
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.4"
      - name: Lint the opam packages
        run: opam lint mlkem.opam mldsa.opam slhdsa.opam
      - name: Install from the package definition
        run: opam install . --with-test --with-doc

  archive:
    name: Release archive
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the known-answer subset against the corpora
        run: |
          sh test/kat/import.sh
          git diff --exit-code -- test/kat
          test -z "$(git status --porcelain -- test/kat)"
      - name: Build the archive GitHub serves for a tag
        run: |
          git archive --format=tar.gz --prefix=ocaml-pq/ -o "$RUNNER_TEMP/ocaml-pq.tar.gz" HEAD
          size=$(wc -c < "$RUNNER_TEMP/ocaml-pq.tar.gz")
          echo "Release archive: $size bytes (budget 524288)"
          if [ "$size" -gt 524288 ]; then
            echo "::error::release archive is $size bytes, over the 512 KiB budget"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/ocaml-pq.tar.gz" -C "$RUNNER_TEMP"
          for path in formal test/vectors test/wycheproof test/mldsa_vectors test/slhdsa_vectors; do
            if [ -e "$RUNNER_TEMP/ocaml-pq/$path" ]; then
              echo "::error::$path is in the release archive"
              exit 1
            fi
          done
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.4"
      - name: Install test dependencies
        run: opam install . --deps-only --with-test
      - name: Build and test the packages from the archive
        run: >-
          opam exec -- sh -c 'cd "$RUNNER_TEMP/ocaml-pq" &&
          dune build -p mlkem,mldsa,slhdsa @install @runtest'

  fuzz:
    name: Decoder fuzzing
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.4"
      - name: Install test dependencies
        run: opam install . --deps-only --with-test
      - name: Install the fuzzing dependency
        run: opam install crowbar
      - name: Compile all decoder fuzz targets
        run: >-
          opam exec -- dune build --profile fuzz
          fuzz/fuzz_mlkem.exe
          fuzz/fuzz_mldsa.exe
          fuzz/fuzz_slhdsa.exe
          fuzz/fuzz_slhdsa_keys.exe
      - name: Run bounded decoder fuzzing
        run: |
          opam exec -- dune exec --profile fuzz fuzz/fuzz_mlkem.exe -- -r 5000 -s 1515870810
          opam exec -- dune exec --profile fuzz fuzz/fuzz_mldsa.exe -- -r 5000 -s 1515870810
          opam exec -- dune exec --profile fuzz fuzz/fuzz_slhdsa.exe -- -r 5000 -s 1515870810
          opam exec -- dune exec --profile fuzz fuzz/fuzz_slhdsa_keys.exe -- -r 1 -s 1515870810

  native-code:
    name: Native-code regression OCaml ${{ matrix.ocaml-compiler }}
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.13", "5.4"]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - name: Install build dependencies
        run: opam install . --deps-only
      - name: Build optimized native archives
        run: >-
          opam exec -- dune build --profile compiler-audit
          lib/mlkem.a
          mldsa/mldsa.a
      - name: Inspect sensitive native control flow
        run: |
          sh compiler/inspect_mlkem_native.sh
          sh compiler/inspect_mldsa_native.sh

  js_of_ocaml:
    name: js_of_ocaml
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.4"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install js_of_ocaml
        run: opam install . --deps-only --with-test && opam install js_of_ocaml-compiler
      - name: Compile the portability test to JavaScript
        run: opam exec -- dune build --profile js test/test_js.bc.js
      - name: Run the portability test
        run: node _build/default/test/test_js.bc.js
